name: release-installer

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            extension/package-lock.json
            desktop/package-lock.json

      - name: Install extension dependencies
        run: npm ci
        working-directory: extension

      - name: Build extension
        run: npm run build
        working-directory: extension

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop

      - name: Validate desktop runtime scripts
        run: npm run check
        working-directory: desktop

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        run: npm run dist:win
        working-directory: desktop

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: iRefinedX-installer-${{ github.event.release.tag_name || github.run_number }}
          path: desktop/dist/iRefinedX-Setup-*.exe

      - name: Attach assets to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" desktop/dist/iRefinedX-Setup-*.exe --clobber
